---
# reporter mongo username
orchestrator_reporter_user: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/reporter/user') }}
# reporter mongo password
orchestrator_reporter_pw: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/reporter/password') }}
# reporter mongo database
orchestrator_reporter_db: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/reporter/database') }}

# scan-reader mongo username
orchestrator_scan_reader_user: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/scan-reader/user') }}
# scan-reader mongo password
orchestrator_scan_reader_pw: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/scan-reader/password') }}
# scan-reader mongo database
orchestrator_scan_reader_db: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/scan-reader/database') }}

# scan-writer mongo username
orchestrator_scan_writer_user: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/scan-writer/user') }}
# scan-writer mongo password
orchestrator_scan_writer_pw: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/scan-writer/password') }}
# scan-writer mongo database
orchestrator_scan_writer_db: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/scan-writer/database') }}
orchestrator_user: "{{ ansible_role_user }}"
orchestrator_group: "{{ ansible_role_group }}"

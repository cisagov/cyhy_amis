---
# The CyHy SSH private key
cyhy_commander_ssh_private_key: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/ssh/private_key') }}

# commander mongo username
cyhy_commander_commander_user: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/commander/user') }}
# commander mongo password
cyhy_commander_commander_pw: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/commander/password') }}
# commander mongo database
cyhy_commander_commander_db: >-
  {{ lookup('amazon.aws.aws_ssm', '/cyhy/mongo/users/commander/database') }}
cyhy_commander_user: "{{ ansible_role_user }}"
cyhy_commander_group: "{{ ansible_role_group }}"

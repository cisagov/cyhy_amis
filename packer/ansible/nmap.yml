---
- name: Install nmap
  hosts: nmap
  become: true
  become_method: ansible.builtin.sudo
  roles:
    - role: cyhy_runner
      vars:
        cyhy_runner_file_owner_group: "{{ cyhy_user_username }}"
        cyhy_runner_file_owner_username: "{{ cyhy_user_username }}"
    - nmap
    - more_ephemeral_ports
